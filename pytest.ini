# Automatische Tests (Entscheidung 05.11.2026): .venv/bin/python -m pytest
# Nur schnelle Tests ohne Testplatten:  .venv/bin/python -m pytest -m "not integration"
[pytest]
testpaths = tests
pythonpath = . tool tests tests/schutz
markers =
    integration: braucht die erzeugten Testplatten und externe Werkzeuge (Siegfried, ExifTool); läuft Hintergrundläufe und den Server
    anton_dev: braucht eine lokale Anton-Entwicklungsinstanz (ddev) und ihren Token in der Umgebung; importiert dorthin und setzt danach zurück
addopts = -ra
