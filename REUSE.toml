# Lizenzangaben nach REUSE (https://reuse.software), Entscheidung 12.11.2026 in docs/plan.md.
# Passen mehrere Angaben auf eine Datei, gilt die letzte: zuerst das Allgemeine, darunter die Ausnahmen.
# Prüfen: tests/test_lizenz.py (oder `reuse lint`, wenn das Werkzeug installiert ist).
version = 1

# Eigener Code und alles, was sonst nicht genannt ist
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Marc Eric Mitzscherling"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Eigene Dokumentation und Regeltabellen
[[annotations]]
path = ["*.md", "**/*.md", "docs/**", "vorgaben/*.csv"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Marc Eric Mitzscherling"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Zeichen des Tools: Elefant nach „Elephant“ von GDJ (Pixabay, Bild 5553128), nicht unter der AGPL
[[annotations]]
path = ["tool/web/balduin.png", "tool/web/balduin_dunkel.png", "tool/web/favicon.ico", "tool/web/favicon.png", "docs/logo/**", "auslieferung/symbol.png", "auslieferung/mac/symbol_ebenen/**",
        ".github/logos/balduin_kontur.png"]
precedence = "override"
SPDX-FileCopyrightText = "GDJ (Pixabay, Bild 5553128); Bearbeitung 2026 Marc Eric Mitzscherling"
SPDX-License-Identifier = "LicenseRef-Pixabay"

# Fremdbestandteile mit eigener Lizenz
[[annotations]]
path = "tool/web/vendor/lucide/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "tool/web/vendor/inter/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "vorgaben/anton_import/*.schema.json"
precedence = "override"
SPDX-FileCopyrightText = "Kraenzle & Ritter"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vorgaben/nara/**"
precedence = "override"
SPDX-FileCopyrightText = "U.S. National Archives and Records Administration (NARA)"
SPDX-License-Identifier = "LicenseRef-NARA-Gemeinfrei"

# Logo der Stiftung Eisenbibliothek (README, Dank); helle Fassung für die dunkle Ansicht, nicht unter der AGPL
[[annotations]]
path = ".github/logos/eisenbibliothek*.svg"
precedence = "override"
SPDX-FileCopyrightText = "Stiftung Eisenbibliothek, Schaffhausen"
SPDX-License-Identifier = "LicenseRef-Eisenbibliothek-Logo"

# Infografik im README: eigene Gestaltung mit dem Elefanten nach GDJ (Pixabay, Bild 5553128)
[[annotations]]
path = ".github/infografik*.png"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Marc Eric Mitzscherling", "GDJ (Pixabay, Bild 5553128)"]
SPDX-License-Identifier = "CC-BY-SA-4.0 AND LicenseRef-Pixabay"
